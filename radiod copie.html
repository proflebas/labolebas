<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio'D – Lecteur</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f4f4f9;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #003366, #0055aa);
      color: white;
      padding: 2rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    header img.logo {
      height: 60px;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    section {
      padding: 2rem;
    }

    /* ── Lecteur en cours ── */
    .now-playing {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .now-playing-label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #1db954;
      margin-bottom: 0.4rem;
    }
    .now-playing-title {
      font-size: 1rem;
      font-weight: bold;
      color: #003366;
      margin-bottom: 0.3rem;
    }
    .now-playing-desc {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.4;
      margin-bottom: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    audio {
      width: 100%;
      accent-color: #003366;
    }

    /* ── Liste des épisodes ── */
    .episode-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .episode-item {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      border-left: 4px solid transparent;
    }
    .episode-item:hover {
      transform: scale(1.01);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .episode-item.active {
      border-left-color: #003366;
      background: linear-gradient(135deg, #eef2ff, #f4f6ff);
    }

    .ep-num {
      font-size: 0.8rem;
      font-weight: bold;
      color: #aab;
      min-width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .episode-item.active .ep-num { color: #0055aa; }

    .ep-play-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #003366, #0055aa);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }
    .episode-item:hover .ep-play-btn { transform: scale(1.1); }
    .ep-play-btn svg {
      width: 12px; height: 12px;
      fill: white;
      margin-left: 2px;
    }

    .ep-info { flex: 1; min-width: 0; }
    .ep-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .episode-item.active .ep-title { color: #003366; }
    .ep-meta {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    /* ── État chargement ── */
    .state-msg {
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 2rem;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #dde;
      border-top-color: #003366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.8rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      background: #003366;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <img src="logos/mascotte-labolebas.png" alt="Logo Labo Lebas" class="logo">
    <h1>Radio'D</h1>
  </header>

  <section>

    <div class="now-playing">
      <div class="now-playing-label">▶ En écoute</div>
      <div class="now-playing-title" id="npTitle">Sélectionne un épisode ci-dessous</div>
      <div class="now-playing-desc" id="npDesc">Le podcast réalisé par les élèves du collège Alphonse Daudet d'Istres</div>
      <audio id="player" controls preload="none"></audio>
    </div>

    <div class="episode-list" id="episodeList">
      <div class="state-msg">
        <div class="spinner"></div>
        Chargement des épisodes…
      </div>
    </div>

  </section>

  <footer>
    Site réalisé par J. Lebas – Collège Alphonse Daudet d'Istres
  </footer>

<script>
const RSS_URL    = 'https://labolebas.com/radiod.xml';
const CORS_PROXY = 'https://api.allorigins.win/get?url=';

const player  = document.getElementById('player');
const npTitle = document.getElementById('npTitle');
const npDesc  = document.getElementById('npDesc');
const listEl  = document.getElementById('episodeList');

let episodes  = [];
let activeIdx = -1;

function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return '';
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderList() {
  if (!episodes.length) {
    listEl.innerHTML = '<div class="state-msg">Aucun épisode trouvé.</div>';
    return;
  }
  listEl.innerHTML = episodes.map((ep, i) => `
    <div class="episode-item${i === activeIdx ? ' active' : ''}" data-idx="${i}">
      <span class="ep-num">${String(i + 1).padStart(2,'0')}</span>
      <div class="ep-play-btn">
        <svg viewBox="0 0 10 12"><path d="M0 0l10 6-10 6z"/></svg>
      </div>
      <div class="ep-info">
        <div class="ep-title">${ep.title}</div>
        <div class="ep-meta">${fmtDate(ep.pubDate)}${ep.duration ? ' · ' + ep.duration : ''}</div>
      </div>
    </div>
  `).join('');

  listEl.querySelectorAll('.episode-item').forEach(el => {
    el.addEventListener('click', () => playEpisode(parseInt(el.dataset.idx)));
  });
}

function playEpisode(idx) {
  if (idx < 0 || idx >= episodes.length) return;
  activeIdx = idx;
  const ep  = episodes[idx];
  npTitle.textContent = ep.title;
  npDesc.textContent  = ep.description || '';
  player.src = ep.url;
  player.play();
  renderList();
  const active = listEl.querySelector('.episode-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function parseRSS(xmlText) {
  const parser = new DOMParser();
  const xml    = parser.parseFromString(xmlText, 'application/xml');
  return Array.from(xml.querySelectorAll('item')).map(item => ({
    title:       item.querySelector('title')?.textContent || 'Sans titre',
    description: item.querySelector('description')?.textContent || '',
    url:         item.querySelector('enclosure')?.getAttribute('url') || '',
    pubDate:     item.querySelector('pubDate')?.textContent || '',
    duration:    item.querySelector('duration')?.textContent || '',
  }));
}

async function loadFeed() {
  try {
    const r = await fetch(RSS_URL);
    if (r.ok) { episodes = parseRSS(await r.text()); renderList(); return; }
  } catch(_) {}
  try {
    const r = await fetch(CORS_PROXY + encodeURIComponent(RSS_URL));
    if (r.ok) { episodes = parseRSS((await r.json()).contents); renderList(); return; }
  } catch(_) {}
  listEl.innerHTML = '<div class="state-msg">Impossible de charger les épisodes.<br>Vérifie les headers CORS du serveur.</div>';
}

loadFeed();
</script>
</body>
</html>
