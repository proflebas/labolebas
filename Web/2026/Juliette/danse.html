<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Danse</title> <!-- Change le titre de l'onglet ici -->

  <style>

    /* La page entière */
    body {
      background-color:  #FF91A4 ; /* couleur de fond */
      color: white;              /* couleur du texte */
      font-family: Arial;
      text-align: center;
    }

    /* Le grand titre */
    h1 {
      font-size: 50px;
      color:  #E30B5C; /* couleur du titre */
      padding: 40px;
    }

    /* La zone qui contient toutes les fiches */
    .grille {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    /* Une fiche */
    .fiche {
      background-color: #8B008B; /* couleur de fond des fiches */
      border-radius: 15px;
      width: 220px;
      padding: 15px;
    }

    /* L'image dans une fiche */
    .fiche img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Le titre dans une fiche */
    .fiche h2 {
      font-size: 18px;
      margin: 10px 0 5px;
    }

    /* Le texte dans une fiche */
    .fiche p {
      font-size: 14px;
      color: #aaaaaa; /* couleur du texte des fiches */
    }

  </style>
</head>
