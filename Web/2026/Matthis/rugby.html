    /* Une fiche */
    .fiche {

      border-radius: 15px;
      width: 220px;
      padding: 15px;
    }

    /* L'image dans une fiche */
    .fiche img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Le titre dans une fiche */
    .fiche h2 {
      font-size: 18px;
      margin: 10px 0 5px;
    }

    /* Le texte dans une fiche */
    .fiche p {
      font-size: 14px;
      color: #violet; /* couleur du texte des fiches */
    }
