    /* La page entière */
    body {

      font-family: Arial;
      text-align: center;
    }

    /* Le grand titre */
    h1 {
      font-size: 50px;
      color:#F8523F; /* couleur du titre */
      padding: 40px;
      width: 100%;
      text-align: center;
    }

    a{
      color : inherit;
      text-decoration: none;
    }

    /* La zone qui contient toutes les fiches */
    .grille {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }

    /* Une fiche */
    .fiche {
      background-color: #E68470; /* couleur de fond des fiches */
      border-radius: 15px;
      width: 220px;
      padding: 15px;
    }

    /* L'image dans une fiche */
    .fiche img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Le titre dans une fiche */
    .fiche h2 {
      font-size: 18px;
      margin: 10px 0 5px;
    }

    /* Le texte dans une fiche */
    .fiche p {
      font-size: 14px;
      color: #ECA58D; /* couleur du texte des fiches */
    }

  </style>
</head>
