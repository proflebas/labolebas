<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page en cours de construction</title>
  <link rel="icon" href="logos/favicon.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #003366, #0055aa);
      color: white;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    header img.logo {
      height: 60px;
    }
    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    picture img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    a.back {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background-color: #003366;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    a.back:hover {
      background-color: #0055aa;
    }
    footer {
      background: #003366;
      color: white;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="logos/mascotte-labolebas.png" alt="Logo Labo Lebas" class="logo">
    <h1>Labo Lebas</h1>
  </header>
  <main>
    <picture>
      <source media="(orientation: portrait)" srcset="Laby construit un site - portrait.png">
      <img src="Laby construit un site - paysage.png" alt="Page en cours de construction">
    </picture>
    <a class="back" href="index.html">Retour au menu</a>
  </main>
  <footer>
    Site réalisé par J. Lebas – Collège Alphonse Daudet d’Istres
  </footer>
</body>
</html>
